app = "minilink"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  BASE_URL = "https://minilink.fly.dev"

# Secrets — set once via CLI before first deploy, never stored here:
#   fly secrets set DATABASE_URL="postgres://..."
#   fly secrets set REDIS_URL="redis://..."

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
