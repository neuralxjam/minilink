<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MiniLink</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <div class="max-w-3xl mx-auto py-12 px-4">

    <!-- Header -->
    <div class="mb-10">
      <h1 class="text-3xl font-bold text-gray-900 tracking-tight">MiniLink</h1>
      <p class="text-gray-500 mt-1 text-sm">Self-hosted URL shortener with redirect analytics</p>
    </div>

    <!-- Shorten form -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 mb-6">
      <h2 class="text-base font-semibold text-gray-800 mb-4">Shorten a URL</h2>
      <form
        hx-post="/shorten/form"
        hx-target="#shorten-result"
        hx-swap="innerHTML"
        hx-on::after-request="if(event.detail.successful) this.reset()"
      >
        <div class="flex gap-3">
          <input
            type="url"
            name="url"
            placeholder="https://example.com/very/long/url"
            required
            class="flex-1 rounded-lg border border-gray-300 px-4 py-2 text-sm
                   focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
          />
          <button
            type="submit"
            class="bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800
                   text-white text-sm font-medium px-5 py-2 rounded-lg transition-colors"
          >
            Shorten
          </button>
        </div>
      </form>
      <div id="shorten-result" class="mt-3 min-h-[1.5rem]"></div>
    </div>

    <!-- Links table -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
      <h2 class="text-base font-semibold text-gray-800 mb-4">Top Links</h2>
      <div
        id="links-container"
        hx-get="/dashboard/links"
        hx-trigger="load, linksUpdated from:body"
        hx-swap="innerHTML"
      >
        <p class="text-sm text-gray-400 py-2">Loading&hellip;</p>
      </div>
    </div>

  </div>
</body>
</html>
